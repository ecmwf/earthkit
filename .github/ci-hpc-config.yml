build:
  python: 3.10
  parallel: 1
  modules:
  - ninja
  python_dependencies:
  - ecmwf/eccodes-python@develop
  - ecmwf/pyodc@develop
  - ecmwf/earthkit-utils@develop
  - ecmwf/earthkit-hydro@develop
  - ecmwf/earthkit-data@develop
  - ecmwf/earthkit-meteo@develop
  pytest_cmd: |
    FINDLIBS_DISABLE_PACKAGE=no python -m pytest --forked -vv --cov=. --cov-report=html
